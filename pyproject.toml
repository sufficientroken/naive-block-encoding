[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "naive-block-encoding"
version = "0.1.0"
description = "Dense unitary-dilation block encoding circuits in Qiskit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "qiskit>=2.2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
naive-block-encoding = "naive_block_encoding.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
naive_block_encoding = ["data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
